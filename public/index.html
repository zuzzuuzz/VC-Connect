    <script>
    function toggleRoleSwitcher() {
        const switcher = document.getElementById('role-switcher');
        if (!switcher) return;
        switcher.classList.toggle('minimized');
        const isMin = switcher.classList.contains('minimized');
        localStorage.setItem('roleSwitcherMinimized', isMin ? 'true' : 'false');
    }
    if (localStorage.getItem('roleSwitcherMinimized') === 'true') {
        const s = document.getElementById('role-switcher');
        if (s) s.classList.add('minimized');
    }

    function switchRole(roleKey) {
        const profile = window.demoProfiles[roleKey];
        if (!profile) return;
        localStorage.setItem("auth.user", JSON.stringify(profile));
        localStorage.setItem("auth.role_slug", profile.role_slug);
        localStorage.setItem("auth.permissions", JSON.stringify(profile.permissions));
        localStorage.setItem("auth.rememberMe", "true");
        document.cookie = "XSRF-TOKEN=velourcare-auth-" + profile.id + "; path=/; max-age=86400; SameSite=Lax";
        document.cookie = "laravel_session=velourcare-jwt-bearer-" + profile.id + "; path=/; max-age=86400; SameSite=Lax";
        window.location.href = "/dashboard";
    }

    function logoutUser() {
        localStorage.removeItem("auth.user");
        localStorage.removeItem("auth.role_slug");
        localStorage.removeItem("auth.permissions");
        localStorage.removeItem("auth.rememberMe");
        document.cookie = "XSRF-TOKEN=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT";
        document.cookie = "laravel_session=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT";
        window.location.href = "/login";
    }

                    </div>
                </div>
            `;

            const chiefCard = Array.from(document.querySelectorAll('.card')).find(c => c.innerText.includes('Chief Complaint') || c.innerText.includes('Treatment Plan'));
            if (chiefCard && chiefCard.parentNode) {
                chiefCard.parentNode.insertBefore(iprCard, chiefCard.nextSibling);
            } else {
                targetContainer.appendChild(iprCard);
            }
        }

        // Reactive Injection via MutationObserver (eliminates 500ms DOM polling interval)
        let debounceTimer = null;
        function scheduleCheck() {
            if (debounceTimer) clearTimeout(debounceTimer);
            debounceTimer = setTimeout(checkAndInjectIPR, 80);
        }

        const observer = new MutationObserver((mutations) => {
            if (window.location.pathname.includes('/cases/') && window.location.pathname.includes('/view')) {
                if (document.getElementById('velourcare-ipr-section') && document.getElementById('velourcare-ipr-tab-item')) {
                    return;
                }
                scheduleCheck();
            }
        });

        observer.observe(document.body, { childList: true, subtree: true });
        window.addEventListener('popstate', scheduleCheck);
        window.addEventListener('DOMContentLoaded', scheduleCheck);
        setTimeout(scheduleCheck, 200);
    })();
    </script>
</body>
